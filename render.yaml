services:
  # All-in-One Fullstack Web Service for Render (Recommended)
  # Builds both backend & React frontend, then serves everything on 1 single public URL.
  - type: web
    name: cinevault-camera-management
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Paste your Neon PostgreSQL pooled connection string here in Render Dashboard
      - key: DIRECT_URL
        sync: false # Paste your Neon PostgreSQL direct (non-pooler) connection string here in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
